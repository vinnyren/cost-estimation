[project]
name = "cost-estimation-server"
version = "1.0.0"
description = "软件造价制作系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-magic>=0.4.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "httpx>=0.27",
    "hypothesis>=6.99",
    "mutmut>=2.5",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
fail_under = 80

[tool.mutmut]
paths_to_mutate = ["app/core/"]
backup = false
# 仅跑 core 相关的 unit tests（不依赖 repo-root 路径），避开 mutmut v3 在
# server/mutants/ 子目录下 cwd 时打破 Path(__file__).parent.parent.parent 的假设。
# excel_exporter / validator / golden / integration 都在 mutants cwd 下找不到外部文件，故排除。
tests_dir = [
    "tests/unit/test_forward.py",
    "tests/unit/test_reverse.py",
    "tests/unit/test_allocator.py",
    "tests/unit/test_factors.py",
    "tests/unit/test_context.py",
    "tests/unit/test_models.py",
]
do_not_mutate = [
    "*/__init__.py",
    "*__pycache__*",
]
